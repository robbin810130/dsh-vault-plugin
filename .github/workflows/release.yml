name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - run: pnpm --dir plugin install --frozen-lockfile
      - run: node scripts/verify-release.mjs "${GITHUB_REF_NAME}"
      - run: node scripts/package-release.mjs
      - run: pnpm --dir plugin exec vitest run
      - run: pnpm --dir plugin exec tsc -p tsconfig.host.json --noEmit
      - run: pnpm --dir plugin exec tsc -p tsconfig.client.json --noEmit
      - run: node --test tests/install-script.test.mjs tests/scripts/*.test.mjs
      - run: git diff --check
      - name: Add DSH compatibility patch asset
        run: |
          cp compat/dsh-v0.1.2-rc.1/0001-plugin-access-seams.patch artifacts/dsh-vault-plugin-dsh-v0.1.2-rc.1.patch
          cp compat/dsh-v0.1.5-rc.1/0001-plugin-access-seams.patch artifacts/dsh-vault-plugin-dsh-v0.1.5-rc.1.patch
          tar -czf artifacts/dsh-vault-compat-dsh-v0.1.5-rc.1.tgz -C compat dsh-v0.1.5-rc.1
          cd artifacts && sha256sum *.patch dsh-vault-compat-*.tgz > compatibility.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/dsh-vault-plugin.tgz
          artifacts/dsh-vault-plugin.tgz.sha256
          artifacts/dsh-vault-plugin-dsh-v0.1.2-rc.1.patch
          artifacts/dsh-vault-plugin-dsh-v0.1.5-rc.1.patch
          artifacts/dsh-vault-compat-dsh-v0.1.5-rc.1.tgz
          artifacts/compatibility.sha256
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
