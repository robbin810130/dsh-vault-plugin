name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned DSH 0.1.2 source for legacy patch tests
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: .cache/deepseek-harness
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - run: pnpm --dir plugin install --frozen-lockfile
      - run: node scripts/verify-release.mjs "${GITHUB_REF_NAME}"
      - run: node scripts/package-release.mjs
      - run: pnpm --dir plugin exec vitest run
      - run: pnpm --dir plugin exec tsc -p tsconfig.host.json --noEmit
      - run: pnpm --dir plugin exec tsc -p tsconfig.client.json --noEmit
      - run: node --test tests/install-script.test.mjs tests/scripts/*.test.mjs
      - run: git diff --check
      - name: Build pinned DSH 0.1.7 compatibility bundles
        run: |
          mkdir -p .cache artifacts/dsh-v017-bundles
          curl --fail --location --retry 3 \
            https://codeload.github.com/deepseek-ai/deepseek-harness/tar.gz/refs/tags/dsh-v0.1.7-rc.1 \
            --output .cache/dsh-v0.1.7-rc.1-source.tar.gz
          node compat/dsh-v0.1.7-rc.1/build-compat.mjs artifacts/dsh-v017-bundles .cache/dsh-v0.1.7-rc.1-source.tar.gz
          cp compat/dsh-v0.1.2-rc.1/0001-plugin-access-seams.patch artifacts/dsh-vault-plugin-dsh-v0.1.2-rc.1.patch
          cp compat/dsh-v0.1.5-rc.1/0001-plugin-access-seams.patch artifacts/dsh-vault-plugin-dsh-v0.1.5-rc.1.patch
          cp compat/dsh-v0.1.7-rc.1/0001-plugin-access-seams.patch artifacts/dsh-vault-plugin-dsh-v0.1.7-rc.1.patch
          tar -czf artifacts/dsh-vault-compat-dsh-v0.1.5-rc.1.tgz -C compat dsh-v0.1.5-rc.1
          tar -czf artifacts/dsh-vault-compat-dsh-v0.1.7-rc.1.tgz -C compat dsh-v0.1.7-rc.1
          tar -czf artifacts/dsh-vault-client-bundles-dsh-v0.1.7-rc.1.tgz -C artifacts/dsh-v017-bundles .
          cd artifacts && shasum -a 256 *.patch dsh-vault-compat-*.tgz dsh-vault-client-bundles-*.tgz > compatibility.sha256
      - name: Retain generated DSH bundles for build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-v017-compat-build
          path: artifacts/dsh-v017-bundles
          if-no-files-found: ignore
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/dsh-vault-plugin.tgz
          artifacts/dsh-vault-plugin.tgz.sha256
          artifacts/dsh-vault-plugin-dsh-v0.1.2-rc.1.patch
          artifacts/dsh-vault-plugin-dsh-v0.1.5-rc.1.patch
          artifacts/dsh-vault-plugin-dsh-v0.1.7-rc.1.patch
          artifacts/dsh-vault-compat-dsh-v0.1.5-rc.1.tgz
          artifacts/dsh-vault-compat-dsh-v0.1.7-rc.1.tgz
          artifacts/dsh-vault-client-bundles-dsh-v0.1.7-rc.1.tgz
          artifacts/compatibility.sha256
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
